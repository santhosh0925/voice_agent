<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom AI Voice Assistant</title>
  <style>
    :root {
      --ink: #2f2a28;
      --muted: #6d5f58;
      --rose: #c9656c;
      --rose-dark: #9d4850;
      --leaf: #517866;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.86);
      --line: rgba(157, 72, 80, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background: url('assets/background.png') no-repeat center center fixed;
      background-size: cover;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08) 55%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 246, 247, 0.12));
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(71, 48, 50, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .eyebrow {
      margin: 0;
      color: var(--leaf);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--rose-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 390px;
      margin: -6px 0 4px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .avatar-wrap {
      width: min(220px, 58vw);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 3px solid rgba(201, 101, 108, 0.42);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 16px 42px rgba(157, 72, 80, 0.18);
    }

    #voicebotGif {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .field {
      width: 100%;
      display: grid;
      gap: 8px;
      text-align: left;
    }

    label {
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid rgba(157, 72, 80, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 4px rgba(201, 101, 108, 0.13);
    }

    .actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 46px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--rose);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(157, 72, 80, 0.24);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover {
      background: var(--rose-dark);
      box-shadow: 0 14px 28px rgba(157, 72, 80, 0.28);
      transform: translateY(-2px);
    }

    button:disabled {
      background: #d9c7c1;
      color: rgba(47, 42, 40, 0.55);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      width: 100%;
      min-height: 44px;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(81, 120, 102, 0.1);
      color: #325344;
      font-size: 0.94rem;
      font-weight: 750;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #transcript {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid rgba(81, 120, 102, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.5;
      text-align: left;
      overflow-wrap: anywhere;
    }

    #audio-area {
      width: 100%;
    }

    @media (max-width: 560px) {
      body {
        align-items: stretch;
        padding: 18px;
      }

      .card {
        padding: 22px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="eyebrow">Bloom AI</p>
    <h1>Floral Voice Assistant</h1>
    <p class="subtitle">Ask about flowers, bouquets, orders, and flower care using your voice.</p>

    <div class="avatar-wrap" aria-hidden="true">
      <img id="voicebotGif" src="assets/avatar_idle.gif" alt="Voice Bot Animation">
    </div>

    <div class="field">
      <label for="name">Your Name</label>
      <input id="name" value="guest" autocomplete="name">
    </div>

    <div class="actions">
      <button id="joinBtn">Join</button>
      <button id="leaveBtn" disabled>Leave</button>
    </div>

    <div id="status" aria-live="polite">Ready when you are.</div>
    <div id="transcript" aria-live="polite">Transcript will appear here.</div>
    <div id="audio-area"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    const TOKEN_API_URL = '/api/getToken';
    const CONFIG_API_URL = '/api/config';
    let LIVEKIT_WS_URL = null;

    const { Room, RoomEvent, Track } = window.LivekitClient;
    let room = null;

    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const statusDiv = document.getElementById('status');
    const nameInput = document.getElementById('name');
    const audioArea = document.getElementById('audio-area');
    const voicebotGif = document.getElementById('voicebotGif');
    const transcript = document.getElementById('transcript');

    function setAvatarState(state) {
      const gifPath = `assets/avatar_${state}.gif`;
      if (!voicebotGif.src.endsWith(gifPath)) {
        voicebotGif.src = gifPath;
      }
    }

    async function readJsonResponse(resp, endpointName) {
      const text = await resp.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error(`${endpointName} returned ${resp.status} ${resp.statusText || ''} instead of JSON`);
      }
      if (!resp.ok) {
        throw new Error(data.error || `${endpointName} failed with status ${resp.status}`);
      }
      return data;
    }

    function setupSpeakingListeners() {
      room.localParticipant.on('speakingStatusChanged', (speaking) => {
        if (speaking) {
          setAvatarState("listening");
        } else {
          const isRemoteSpeaking = Array.from(room.remoteParticipants.values()).some(p => p.isSpeaking);
          if (!isRemoteSpeaking) setAvatarState("thinking");
        }
      });

      const handleRemoteSpeaker = (participant) => {
        participant.on('speakingStatusChanged', (speaking) => {
          if (speaking) {
            setAvatarState("speaking");
          } else if (!room.localParticipant.isSpeaking) {
            setAvatarState("idle");
          }
        });
      };

      room.remoteParticipants.forEach(handleRemoteSpeaker);
      room.on('participantConnected', handleRemoteSpeaker);
    }

    joinBtn.onclick = async () => {
      joinBtn.disabled = true;
      statusDiv.innerText = 'Requesting token...';
      const name = nameInput.value.trim() || "guest";
      let token, roomName;

      try {
        if (!LIVEKIT_WS_URL) {
          const configResp = await fetch(CONFIG_API_URL);
          const config = await readJsonResponse(configResp, CONFIG_API_URL);
          if (!config.livekitUrl) throw new Error('LiveKit URL is not configured');
          LIVEKIT_WS_URL = config.livekitUrl;
        }
        const resp = await fetch(`${TOKEN_API_URL}?name=${encodeURIComponent(name)}`);
        const data = await readJsonResponse(resp, TOKEN_API_URL);
        token = data.token;
        roomName = data.room;
      } catch (e) {
        statusDiv.innerText = "Could not prepare LiveKit connection: " + e.message;
        joinBtn.disabled = false;
        return;
      }

      statusDiv.innerText = `Joining room: ${roomName}...`;
      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === Track.Kind.Audio) {
          const audioEl = track.attach();
          audioEl.autoplay = true;
          audioEl.muted = false;
          audioEl.setAttribute('playsinline', 'true');
          audioArea.appendChild(audioEl);
          audioEl.play().catch(() => {
            statusDiv.innerText = "Click anywhere on the page to enable assistant audio.";
          });
          statusDiv.innerText = "Assistant audio connected.";
        }
      });

      room.on(RoomEvent.TranscriptionReceived, (segments) => {
        const text = segments.map(segment => segment.text || '').join(' ').trim();
        if (text) transcript.innerText = `Transcript: ${text}`;
      });

      room.on(RoomEvent.Disconnected, () => {
        statusDiv.innerText = "Disconnected.";
        leaveBtn.disabled = true;
        joinBtn.disabled = false;
        audioArea.innerHTML = "";
      });

      try {
        await room.connect(LIVEKIT_WS_URL, token);
        if (typeof room.startAudio === 'function') {
          try {
            await room.startAudio();
          } catch (audioError) {
            console.warn('Browser audio autoplay is not yet unlocked:', audioError);
          }
        }
        await room.localParticipant.setMicrophoneEnabled(true);
        statusDiv.innerText = `Welcome to Bloom AI. You are connected to room: ${roomName}.`;
        leaveBtn.disabled = false;

        setAvatarState("idle");
        setupSpeakingListeners();
      } catch (e) {
        statusDiv.innerText = "Could not join LiveKit room: " + e;
        joinBtn.disabled = false;
      }
    };

    leaveBtn.onclick = () => {
      if (room) {
        room.disconnect();
        audioArea.innerHTML = "";
      }
      statusDiv.innerText = "Left room.";
      leaveBtn.disabled = true;
      joinBtn.disabled = false;
    };
  </script>
</body>

</html>
